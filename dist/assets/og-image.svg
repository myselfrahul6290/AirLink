<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="softGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="rgba(255,255,255,0.1)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#softGlow)"/>

  <!-- Centered Minimal Card -->
  <g transform="translate(300, 105)" filter="url(#cardGlow)">
    <rect width="600" height="420" rx="28" fill="#121215" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

    <!-- Minimal Interlocking Link Icon -->
    <g transform="translate(255, 85)">
      <!-- Left Loop -->
      <path d="M40 10 L75 30 L60 65 L25 45 Z" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Right Loop -->
      <path d="M55 25 L90 45 L75 80 L40 60 Z" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- Brand Name -->
    <text x="300" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#fafafa" text-anchor="middle" letter-spacing="-1">
      AirLink
    </text>

    <!-- Subtitle -->
    <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="middle" letter-spacing="-0.2">
      Private Peer-to-Peer File Transfer
    </text>
  </g>
</svg>
